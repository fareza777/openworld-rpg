<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- scripts from this origin only: the player's own model key lives in this page's workers (docs/byok.md) -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunshard: The Sundered Crown</title>
    <!-- the game's icon: Lumi in pixels (tools/src/art/lumi-icon.py) -->
    <link rel="icon" type="image/png" sizes="60x60" href="./icons/favicon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="manifest" href="./icons/manifest.webmanifest" />
    <meta name="theme-color" content="#221d46" />
    <meta name="description" content="A web-playable 2D JRPG world made of code, which an AI modder extends at runtime." />
    <!-- black from the first paint, as the loading that follows (no white page before the styles arrive) -->
    <style>html, body { background: #05060a; } #loading .splash { background: linear-gradient(#060a16aa,#060a16ef),url(./cinematic/dawn.webp) center/cover; }</style>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
      <div id="labels"></div>
      <div id="hud"></div>
      <div id="dev" class="panel dev hidden"></div>
      <div id="intro" class="hidden"></div>
      <!-- the loading screen (runtime ui/splash.css; the same as the title draws, ui/splash.ts, and game.ts's cover lines) -->
      <div id="loading">
        <div class="splash">
          <div class="sp-glow"></div>
          <img class="sp-icon" src="./icons/icon-192.png" alt="" />
          <div class="sp-title">Sunshard</div>
          <div class="sp-tagline">The Sundered Crown</div>
          <div class="sp-bar"><i></i></div>
          <div class="sp-tips">
            <span style="--i: 0">Light is memory. Every lamp in Solmere was lit by someone who remembered.</span>
            <span style="--i: 1">Hold a thumb on the left half of the screen to walk.</span>
            <span style="--i: 2">The sunsets come a little earlier every year. Someone has been counting.</span>
            <span style="--i: 3">☰ at the top opens your bag, quests, crafting and more.</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
